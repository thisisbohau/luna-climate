boost:
  target:
    entity:
      integration: luna_climate
      domain: climate
  fields:
    duration:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 480
          unit_of_measurement: min
          mode: box
    temperature:
      required: false
      selector:
        number:
          min: 5
          max: 27
          step: 0.5
          unit_of_measurement: "°C"
          mode: box

cancel_boost:
  target:
    entity:
      integration: luna_climate
      domain: climate

cool_for:
  target:
    entity:
      integration: luna_climate
      domain: climate
  fields:
    duration:
      required: false
      default: 30
      selector:
        number:
          min: 1
          max: 480
          unit_of_measurement: min
          mode: box

start_precomfort:

clear_precomfort:

set_schedule:
  target:
    entity:
      integration: luna_climate
      domain: climate
  fields:
    schedule:
      required: true
      selector:
        object:

get_schedule:
  target:
    entity:
      integration: luna_climate
      domain: climate

set_target:
  target:
    entity:
      integration: luna_climate
      domain: climate
  fields:
    value:
      required: true
      example: "21.5"
      selector:
        text:

resume_schedule:
  target:
    entity:
      integration: luna_climate
      domain: climate
